<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Selección Colombia - Web</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }
    .container {
      max-width: 1100px;
      margin: 20px auto;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    header {
      display: grid;
      grid-template-columns: 150px 1fr 200px;
      align-items: center;
      background: #FFD700;
      padding: 10px;
    }
    .logo img {
      width: 110px;
      height: auto;
    }
    .nombre {
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .icons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .icons a {
      text-decoration: none;
      font-size: 1.4rem;
      color: #002f6c;
    }

    .main {
      display: grid;
      grid-template-columns: 180px 1fr 250px;
      gap: 15px;
      padding: 15px;
    }
    nav.menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    nav.menu a {
      padding: 12px;
      background: #0047AB;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }
    nav.menu a:hover {
      background: #003370;
    }

    .content {
      display: grid;
      grid-template-rows: auto auto;
      gap: 20px;
    }
    .videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .videos iframe {
      width: 100%;
      height: 200px;
      border: none;
      border-radius: 8px;
    }
    .textos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .texto {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
    }

    aside {
      display: grid;
      gap: 20px;
    }
    .box img {
      width: 100%;
      border-radius: 8px;
    }

    footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #FFD700;
      padding: 15px;
    }
    footer .col {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #002f6c;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header>
      <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Colombia_national_football_team_logo.png"
             alt="Logo Selección Colombia">
      </div>
      <div class="nombre">Selección Colombia</div>
      <div class="icons">
        <a href="https://www.facebook.com/FCFSeleccionCol" target="_blank">📘</a>
        <a href="https://www.instagram.com/fcfseleccioncol" target="_blank">📷</a>
        <a href="https://twitter.com/FCFSeleccionCol" target="_blank">🐦</a>
      </div>
    </header>

    <div class="main">
      <!-- Menú lateral -->
      <nav class="menu">
        <a href="https://fcf.com.co/" target="_blank">Noticias</a>
        <a href="https://fcf.com.co/calendario/" target="_blank">Calendario</a>
        <a href="https://fcf.com.co/categoria/selecciones/" target="_blank">Jugadores</a>
        <a href="https://fcf.com.co/contacto/" target="_blank">Contacto</a>
      </nav>

      <!-- Centro con videos y textos -->
      <div class="content">
        <div class="videos">
          <iframe src="https://www.youtube.com/embed/ONRp7xzWX_A" title="Conferencia Selección Colombia"></iframe>
          <iframe src="https://www.youtube.com/embed/dSnrzLKiiL4" title="Goles Selección Colombia"></iframe>
        </div>
        <div class="textos">
          <div class="texto">Últimas noticias sobre la Selección Colombia: resultados, análisis y entrevistas.</div>
          <div class="texto">Historia del equipo, jugadores destacados y estadísticas oficiales.</div>
        </div>
      </div>

      <!-- Columna derecha con imágenes -->
      <aside>
        <div class="box">
          <img src="https://upload.wikimedia.org/wikipedia/commons/4/43/Selección_Colombia_Copa_América.jpg"
               alt="Selección Colombia en acción">
        </div>
        <div class="box">
          <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/Colombia_national_football_team_at_2018_World_Cup.jpg"
               alt="Equipo Colombia">
        </div>
      </aside>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="col">
        <span class="dot"></span> Federación Colombiana de Fútbol
      </div>
      <div class="col">
        <span class="dot"></span> Síguenos en redes sociales
      </div>
    </footer>
  </div>
</body>
</html>
